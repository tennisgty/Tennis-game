<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>重砲發球模擬器 4.0</title>
    <style>
        body { 
            margin: 0; padding: 0; background-color: #121212; color: white; 
            font-family: 'Helvetica Neue', sans-serif; overflow: hidden; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; height: 100vh; touch-action: manipulation; 
        }
        #info-panel {
            display: flex; justify-content: space-between; width: 90%; max-width: 400px;
            margin-bottom: 5px; font-size: 15px; color: #aaa;
        }
        #stats-board { 
            width: 90%; max-width: 400px; text-align: center;
            background: #1e1e1e; padding: 12px 0; border-radius: 10px;
            border: 1px solid #333; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .stat-line { margin: 4px 0; }
        .highlight-speed { font-size: 28px; font-weight: bold; color: #ff4757; }
        .highlight-time { font-size: 18px; color: #2ed573; }
        
        #game-area { 
            position: relative; width: 90%; max-width: 400px; height: 50vh; 
            background: linear-gradient(180deg, #1e3799 0%, #0a3d62 100%);
            border: 2px solid #576574; border-radius: 10px; overflow: hidden; 
            cursor: pointer;
        }
        .court-line { position: absolute; background: rgba(255,255,255,0.2); }
        .center-line { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
        .service-line { width: 100%; height: 2px; top: 40%; }

        #ball { 
            position: absolute; width: 24px; height: 24px; background-color: #eccc68; 
            border-radius: 50%; left: calc(50% - 12px); top: -30px; 
            box-shadow: 0 0 10px rgba(236, 204, 104, 0.8); z-index: 3;
        }
        #sweet-spot { 
            position: absolute; width: 100%; height: 50px; 
            background-color: rgba(46, 213, 115, 0.2); bottom: 12%; 
            border-top: 2px solid #2ed573; border-bottom: 2px solid #2ed573; z-index: 2;
        }
        #btn-swing { 
            margin-top: 15px; padding: 16px 0; font-size: 22px; font-weight: bold; 
            background: #ff4757; color: white; border: none; border-radius: 30px; 
            cursor: pointer; box-shadow: 0 5px #c0392b; width: 90%; max-width: 400px;
            text-align: center;
        }
        
        #status-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10; text-align: center;
        }
        .msg-title { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .msg-sub { font-size: 15px; color: #ddd; padding: 0 20px; line-height: 1.5; margin-bottom: 20px; }
        
        .lvl-btn {
            width: 80%; padding: 14px 0; margin: 8px 0; font-size: 16px; font-weight: bold;
            color: white; border: 1px solid #555; border-radius: 8px; cursor: pointer;
        }
        #btn-low { background: #2ed573; border-color: #26af5f; }
        #btn-mid { background: #ffa502; border-color: #e69500; }
        #btn-high { background: #ff4757; border-color: #d93d4a; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="info-panel">
        <span>比分 (我:對手): <span id="score" style="color:#2ed573; font-weight:bold;">0 : 0</span></span>
        <span>難度: <span id="level-label" style="color:#ffa502; font-weight:bold;">未選擇</span></span>
    </div>

    <div id="stats-board">
        <div class="stat-line">本次發球時速: <span id="speed-display" class="highlight-speed">--</span> km/h</div>
        <div class="stat-line">球落地反應時間: <span id="time-display" class="highlight-time">--</span> 秒</div>
    </div>
    
    <div id="game-area">
        <div class="court-line center-line"></div>
        <div class="court-line service-line"></div>
        <div id="sweet-spot"></div>
        <div id="ball"></div>
        
        <div id="status-overlay">
            <div id="menu-view">
                <div class="msg-title" style="color: #fff;">請選擇訓練難度</div>
                <div class="msg-sub">發球速度將在對應級別內隨機波動，考驗真實的反應與節奏。</div>
                <button id="btn-low" class="lvl-btn">業餘俱樂部組 (110-140 km/h)</button>
                <button id="btn-mid" class="lvl-btn">全國公開組 (145-175 km/h)</button>
                <button id="btn-high" class="lvl-btn">ATP 職業巡迴賽組 (190-225 km/h)</button>
            </div>
            
            <div id="msg-view" class="hidden">
                <div id="msg-title" class="msg-title"></div>
                <div id="msg-sub" class="msg-sub"></div>
            </div>
        </div>
    </div>
    
    <button id="btn-swing" class="hidden">點擊開始訓練</button>

    <script>
        const ball = document.getElementById('ball');
        const scoreDisplay = document.getElementById('score');
        const speedDisplay = document.getElementById('speed-display');
        const timeDisplay = document.getElementById('time-display');
        const gameArea = document.getElementById('game-area');
        const statusOverlay = document.getElementById('status-overlay');
        const menuView = document.getElementById('menu-view');
        const msgView = document.getElementById('msg-view');
        const msgTitle = document.getElementById('msg-title');
        const msgSub = document.getElementById('msg-sub');
        const btnSwing = document.getElementById('btn-swing');
        const levelLabel = document.getElementById('level-label');

        const COURT_LENGTH_METERS = 24; 
        let myPoints = 0;   
        let oppPoints = 0;  
        let currentSpeedKmh = 130; 
        let reactionTimeMs = 0;
        
        let gameState = 'SELECTING'; 
        let selectedLevel = ''; 
        let ballY = -30;
        let lastFrameTime = 0;
        let pixelsPerMs = 0;
        let serveTimeout;
        let animationFrame;

        function generateRandomSpeed() {
            let min = 110, max = 140;
            if (selectedLevel === 'mid') { min = 145; max = 175; }
            else if (selectedLevel === 'high') { min = 190; max = 225; }
            currentSpeedKmh = Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function updatePhysicsMath() {
            let speedMs = currentSpeedKmh / 3.6;
            let timeSeconds = COURT_LENGTH_METERS / speedMs;
            reactionTimeMs = timeSeconds * 1000;
            
            speedDisplay.innerText = currentSpeedKmh;
            timeDisplay.innerText = timeSeconds.toFixed(3);
            
            let areaHeight = gameArea.offsetHeight;
            pixelsPerMs = (areaHeight + 30) / reactionTimeMs; 
        }

        function chooseLevel(level, labelText, labelColor) {
            selectedLevel = level;
            levelLabel.innerText = labelText;
            levelLabel.style.color = labelColor;
            
            myPoints = 0;
            oppPoints = 0;
            scoreDisplay.innerText = "0 : 0";
            
            menuView.classList.add('hidden');
            msgView.classList.remove('hidden');
            btnSwing.classList.remove('hidden');
            
            startSequence();
        }

        function startSequence() {
            gameState = 'TOSSING';
            btnSwing.innerText = "對手拋球中...注意！";
            statusOverlay.classList.add('hidden');
            
            ball.style.top = '-30px';
            ballY = -30;
            
            generateRandomSpeed();
            updatePhysicsMath();

            let tossDelay = Math.random() * 1200 + 800; 
            serveTimeout = setTimeout(() => {
                fireServe();
            }, tossDelay);
        }

        function fireServe() {
            gameState = 'SERVING';
            btnSwing.innerText = "快揮拍！！";
            statusOverlay.classList.add('hidden'); 
            
            lastFrameTime = performance.now();
            animationFrame = requestAnimationFrame(updateBall);
        }

        function updateBall(timestamp) {
            if (gameState !== 'SERVING') return;
            
            let deltaTime = timestamp - lastFrameTime;
            lastFrameTime = timestamp;
            
            ballY += pixelsPerMs * deltaTime;
            ball.style.top = ballY + 'px';

            const gameAreaHeight = gameArea.offsetHeight;

            if (ballY > gameAreaHeight) {
                pointEnd('opp', "反應太慢 (Late)", `時速 ${currentSpeedKmh} 公里的發球直接穿過防線！`);
            } else {
                animationFrame = requestAnimationFrame(updateBall);
            }
        }

        function triggerSwing() {
            if (gameState === 'SELECTING') return; 

            if (gameState === 'GAMEOVER') {
                backToMenu();
                return;
            }
            if (gameState === 'POINT_END') {
                startSequence(); 
                return;
            }
            if (gameState === 'TOSSING') {
                clearTimeout(serveTimeout);
                pointEnd('opp', "揮拍太早 (Early)", "對手剛拋球你就揮拍，重心完全被騙倒了！");
                return;
            }
            if (gameState === 'SERVING') {
                checkHit();
            }
        }

        // 優化後的對稱式擊球檢測演算法 (Perfect / Good / Early / Late 四重判定)
        function checkHit() {
            const gameAreaHeight = gameArea.offsetHeight;
            const sweetSpotBottom = gameAreaHeight - (gameAreaHeight * 0.12);
            const sweetSpotTop = sweetSpotBottom - 50;
            
            const ballTop = ballY;
            const ballBottom = ballY + 24; // 球的直徑為 24px
            const ballCenterY = ballY + 12;

            // 1. 揮拍太早：球的下邊緣完全尚未進入綠色擊球區
            if (ballBottom < sweetSpotTop) {
                pointEnd('opp', "揮拍太早 (Early)", "球還沒進到擊球區你就出拍了！");
            } 
            // 2. 揮拍太慢：球的上邊緣已經完全脫離綠色擊球區
            else if (ballTop > sweetSpotBottom) {
                pointEnd('opp', "揮拍太慢 (Late)", "球已經越過身體了！");
            } 
            // 3. 成功觸球：球體與綠色區有重疊
            else {
                // 甜區判定 (Perfect)：球的中心點完美落在綠色帶中央
                if (ballCenterY >= sweetSpotTop && ballCenterY <= sweetSpotBottom) {
                    pointEnd('me', "完美回擊 (Perfect)", `正中球拍甜區！成功接下時速 ${currentSpeedKmh} km/h 的重砲！`);
                } 
                // 偏前觸球 (Good)：球的下半部壓在綠色區，中心點還在上方 (擊球點偏前)
                else if (ballCenterY < sweetSpotTop) {
                    pointEnd('me', "安全回擊 (Good - 擊球偏早)", `擊球點稍前，但成功將時速 ${currentSpeedKmh} km/h 的發球推回場內！`);
                } 
                // 偏後觸球 (Good)：球的上半部壓在綠色區，中心點已經偏下 (擊球點偏後)
                else {
                    pointEnd('me', "安全回擊 (Good - 擊球偏晚)", `擊球點稍晚，勉強將時速 ${currentSpeedKmh} km/h 的發球擋回去！`);
                }
            }
        }

        function getTennisScoreStr() {
            if (myPoints >= 3 && oppPoints >= 3) {
                if (myPoints === oppPoints) return "Deuce";
                if (myPoints === oppPoints + 1) return "Ad : -";
                if (oppPoints === myPoints + 1) return "- : Ad";
            }
            if (myPoints >= 4 && myPoints >= oppPoints + 2) return "Game Winner";
            if (oppPoints >= 4 && oppPoints >= myPoints + 2) return "Game Winner";

            const pts = ["0", "15", "30", "40"];
            return `${pts[myPoints]} : ${pts[oppPoints]}`;
        }

        function pointEnd(winner, title, desc) {
            cancelAnimationFrame(animationFrame);
            
            if (winner === 'me') myPoints++;
            else oppPoints++;

            let currentScoreStr = getTennisScoreStr();
            scoreDisplay.innerText = currentScoreStr;

            let gameWinner = null;
            if (myPoints >= 4 && myPoints >= oppPoints + 2) gameWinner = 'me';
            if (oppPoints >= 4 && oppPoints >= myPoints + 2) gameWinner = 'opp';

            statusOverlay.classList.remove('hidden');
            msgView.classList.remove('hidden');
            menuView.classList.add('hidden');

            if (gameWinner) {
                gameState = 'GAMEOVER';
                let winTitle = gameWinner === 'me' ? "恭喜贏下這局 (Game)！" : "對手贏得這局 (Game)！";
                msgTitle.innerText = winTitle;
                msgTitle.style.color = gameWinner === 'me' ? '#2ed573' : '#ff4757';
                msgSub.innerText = `${desc}\n\n點擊下方按鈕返回難度選單重新開始。`;
                btnSwing.innerText = "點擊返回難度選單";
            } else {
                gameState = 'POINT_END';
                msgTitle.innerText = title;
                msgTitle.style.color = (winner === 'me') ? '#2ed573' : '#ff4757';
                msgSub.innerText = `${desc}\n\n目前比分：${currentScoreStr}`;
                btnSwing.innerText = "點擊準備接下一球";
            }
        }

        function backToMenu() {
            gameState = 'SELECTING';
            levelLabel.innerText = '未選擇';
            levelLabel.style.color = '#ffa502';
            speedDisplay.innerText = "--";
            timeDisplay.innerText = "--";
            
            statusOverlay.classList.remove('hidden');
            msgView.classList.add('hidden');
            menuView.classList.remove('hidden');
            btnSwing.classList.add('hidden');
        }

        function attachMenuEvent(btn, level, label, color) {
            const handler = (e) => {
                e.preventDefault(); e.stopPropagation();
                chooseLevel(level, label, color);
            };
            btn.addEventListener('touchstart', handler, { passive: false });
            btn.addEventListener('click', handler);
        }

        attachMenuEvent(document.getElementById('btn-low'), 'low', '業餘俱樂部組', '#2ed573');
        attachMenuEvent(document.getElementById('btn-mid'), 'mid', '全國公開組', '#ffa502');
        attachMenuEvent(document.getElementById('btn-high'), 'high', 'ATP 職業巡迴賽組', '#ff4757');
        
        const swingHandler = (e) => {
            if (gameState !== 'SELECTING') e.preventDefault(); 
            e.stopPropagation();
            triggerSwing();
        };

        btnSwing.addEventListener('touchstart', swingHandler, { passive: false });
        btnSwing.addEventListener('mousedown', swingHandler);
        
        gameArea.addEventListener('touchstart', swingHandler, { passive: false });
        gameArea.addEventListener('mousedown', swingHandler);

    </script>
</body>
</html>
