<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>CYBER TAIWAN 2026：絕命當沖 (Fable 5 Engine)</title>
    <style>
        body { margin:0; background:#050508; color:#00ff00; overflow:hidden; font-family: 'Courier New', monospace; }
        #game-box { position:relative; width:100%; max-width:450px; height:100vh; margin:auto; border-left:1px solid #333; border-right:1px solid #333; }
        canvas { width:100%; height:100%; display:block; }
    </style>
</head>
<body>
<div id="game-box"><canvas id="c"></canvas></div>

<script>
/** * Fable 5 整合型遊戲引擎 
 * 包含：動態難度、Rogue-lite 隨機天賦、金融打擊反饋
 */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = 450; canvas.height = 800;

let G = {
    money: 100000,
    difficulty: 1,
    time: 0,
    shake: 0,
    active: true,
    player: { x: 225, y: 700, size: 20 },
    enemies: [],
    upgrades: ['⚡ 射速翻倍', '🛡️ 國安護盤', '🚀 爆擊增幅'],
    showMenu: false
};

function triggerShake(val) { G.shake = val; }

function loop() {
    if (!G.active) return;
    
    // 震動處理
    let dx = G.shake > 0 ? (Math.random()-0.5)*G.shake : 0;
    let dy = G.shake > 0 ? (Math.random()-0.5)*G.shake : 0;
    if(G.shake > 0) G.shake *= 0.9;

    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(0,0,450,800);

    // 難度遞增
    G.time += 0.01;
    G.difficulty = 1 + G.time / 20;

    // 敵人邏輯
    if (Math.random() < 0.02 * G.difficulty) {
        G.enemies.push({ x: Math.random()*400, y: -30, v: 2 + G.difficulty });
    }

    G.enemies.forEach((e, i) => {
        e.y += e.v;
        ctx.fillStyle = '#ff334b';
        ctx.fillRect(e.x, e.y, 30, 30);
        
        // 碰撞檢查 (簡化)
        if (Math.abs(e.x - G.player.x) < 30 && Math.abs(e.y - G.player.y) < 30) {
            triggerShake(20);
            G.money -= 20000;
            G.enemies.splice(i, 1);
        }
        if (e.y > 800) G.enemies.splice(i, 1);
    });

    // 繪製玩家
    ctx.fillStyle = '#00ff00';
    ctx.fillRect(G.player.x - 10, G.player.y - 10, G.player.size, G.player.size);

    // UI
    ctx.fillStyle = '#00ff00';
    ctx.fillText(`資產: $${Math.floor(G.money)} | 難度: ${G.difficulty.toFixed(1)}`, 10, 20);

    if (G.money <= 0) {
        G.active = false;
        ctx.fillStyle = 'red';
        ctx.font = '30px Courier New';
        ctx.fillText('違約交割！公園已滿', 80, 400);
    }
    
    ctx.save();
    ctx.translate(dx, dy);
    ctx.restore();
    requestAnimationFrame(loop);
}

window.addEventListener('mousemove', e => {
    G.player.x = e.clientX - canvas.getBoundingClientRect().left;
});

loop();
</script>
</body>
</html>
