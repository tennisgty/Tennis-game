<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER TAIWAN 2026：少年股神覺醒</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { margin: 0; padding: 0; background-color: #050508; color: #fff; font-family: 'PingFang TC', sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        #game-container { position: relative; width: 100%; max-width: 450px; height: 100vh; background: #050508; overflow: hidden; box-shadow: 0 0 40px rgba(0, 255, 255, 0.1); }
        canvas { display: block; width: 100%; height: 100%; position: relative; z-index: 2; }
        
        /* 復古 CRT 掃描線濾鏡 */
        .crt-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
        }

        #hud-panel { position: absolute; top: 15px; left: 0; width: 100%; display: flex; justify-content: space-around; padding: 0 10px; z-index: 10; pointer-events: none; }
        .hud-box { background: rgba(10, 12, 20, 0.85); border: 1px solid #1f2438; border-radius: 6px; padding: 6px 10px; text-align: center; min-width: 85px; box-shadow: 0 0 15px rgba(0,0,0,0.8); backdrop-filter: blur(4px); }
        .hud-label { font-size: 10px; color: #8f9cae; margin-bottom: 3px; font-weight: bold; letter-spacing: 1px; }
        .hud-val { font-size: 16px; font-weight: 900; font-family: monospace; }
        
        #skill-toast { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); background: rgba(255, 165, 0, 0.1); border: 1px solid #ffa500; color: #ffa500; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; text-shadow: 0 0 8px #ffa500; z-index: 10; animation: pulse 2s infinite; pointer-events: none; letter-spacing: 1px; }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 8, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 25px; }
        .hidden { display: none !important; }
        
        .title-cyber { font-size: 34px; font-weight: 900; color: #00ffff; text-shadow: 0 0 20px #00ffff, 0 0 40px #0088ff; letter-spacing: 2px; margin-bottom: 5px; font-style: italic; }
        .subtitle { font-size: 12px; color: #ff007f; font-weight: bold; letter-spacing: 4px; margin-bottom: 40px; text-shadow: 0 0 10px #ff007f; }
        
        .hero-list { width: 100%; display: flex; flex-direction: column; gap: 15px; max-width: 380px; }
        .hero-card { background: linear-gradient(145deg, #10121b, #0a0b10); border: 1px solid #22263f; border-radius: 12px; padding: 18px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
        .hero-card::before { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); transform: skewX(-20deg); transition: 0.5s; }
        .hero-card:active { transform: scale(0.96); border-color: #fff; }
        .hero-card:active::before { left: 150%; }
        
        .card-leon { border-left: 4px solid #39ff14; }
        .card-chloe { border-left: 4px solid #ff007f; }
        .card-sigma { border-left: 4px solid #00ffff; }

        .hero-header { font-size: 16px; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        .hero-desc { font-size: 12px; color: #8a93a8; line-height: 1.5; }
        
        /* Roguelike 選單美化 */
        .rogue-title { font-size: 26px; font-weight: 900; color: #ffcd00; text-shadow: 0 0 15px rgba(255,205,0,0.6); margin-bottom: 10px; }
        .rogue-card { background: rgba(20, 24, 38, 0.9); border: 1px solid #343a56; border-radius: 10px; padding: 16px; cursor: pointer; text-align: left; transition: all 0.2s; margin-bottom: 12px; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        .rogue-card:active { transform: scale(0.95); background: #1e233d; border-color: #00ffff; }
        .rogue-card-title { font-size: 15px; font-weight: bold; color: #00ffff; margin-bottom: 6px; }
        
        .btn-cyber { width: 85%; max-width: 320px; padding: 15px; font-size: 15px; font-weight: 900; border: none; border-radius: 8px; cursor: pointer; background: linear-gradient(90deg, #ff007f, #7000ff); color: #fff; box-shadow: 0 0 20px rgba(255,0,127,0.4); text-transform: uppercase; letter-spacing: 2px; margin-top: 20px; }
        .btn-cyber:active { transform: scale(0.95); }

        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="crt-overlay"></div>
        
        <div id="hud-panel">
            <div class="hud-box" style="border-color:#ffa500;"><div class="hud-label">WAVE</div><div id="hud-wave" class="hud-val" style="color:#ffa500;">01</div></div>
            <div class="hud-box" style="border-color:#39ff14;"><div class="hud-label">NET WORTH</div><div id="hud-money" class="hud-val" style="color:#39ff14;">$150,000</div></div>
            <div class="hud-box" style="border-color:#ff007f;"><div class="hud-label">MARGIN</div><div id="hud-ratio" class="hud-val" style="color:#ff007f;">120%</div></div>
        </div>

        <div id="skill-toast">⚡ 雙擊：不當賠·時空斷裂 ⚡</div>

        <canvas id="gameCanvas"></canvas>

        <div id="menu-overlay" class="overlay">
            <div class="title-cyber">CYBER TAIWAN</div>
            <div class="subtitle">// 少年股神覺醒 //</div>
            
            <div class="hero-list">
                <div class="hero-card card-leon" data-hero="leon">
                    <div class="hero-header"><span style="color:#39ff14;">👨‍💻 歐印流 · Leon</span><span style="font-size:10px; background:#39ff14; color:#000; padding:2px 6px; border-radius:4px;">單發爆破</span></div>
                    <div class="hero-desc">高機率觸發內線暴擊，擊殺獲得巨額資金，適合極限走位點殺。</div>
                </div>
                <div class="hero-card card-chloe" data-hero="chloe">
                    <div class="hero-header"><span style="color:#ff007f;">💁‍♀️ 當沖女王 · Chloe</span><span style="font-size:10px; background:#ff007f; color:#fff; padding:2px 6px; border-radius:4px;">V字火網</span></div>
                    <div class="hero-desc">超高射速擴散彈，容錯率極高，後期可製造覆蓋全場的火力壓制。</div>
                </div>
                <div class="hero-card card-sigma" data-hero="sigma">
                    <div class="hero-header"><span style="color:#00ffff;">🤖 量化巨鯨 · AI</span><span style="font-size:10px; background:#00ffff; color:#000; padding:2px 6px; border-radius:4px;">智能僚機</span></div>
                    <div class="hero-desc">開局自帶兩架浮游砲自動開火，本體專注躲避外資彈幕。</div>
                </div>
            </div>
        </div>

        <div id="rogue-overlay" class="overlay hidden">
            <div class="rogue-title">⚠️ 融資擴張</div>
            <div style="font-size:12px; color:#8f9cae; margin-bottom:20px;">選擇你的暗黑兵法</div>
            <div style="width:100%; max-width:380px;" id="rogue-cards-box"></div>
        </div>

        <div id="settle-overlay" class="overlay hidden">
            <div class="title-cyber" style="color:#ff3333; text-shadow:0 0 20px #ff3333;">ACCOUNT BUSTED</div>
            <div style="font-size:14px; color:#aaa; margin-bottom:10px;">維持率歸零，含淚睡公園</div>
            <div id="settle-score" style="font-size:38px; font-weight:900; color:#ffcd00; margin:20px 0; font-family:monospace;">$0</div>
            <button id="btn-restart" class="btn-cyber">🔄 重新籌資進場</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlays = {
            menu: document.getElementById('menu-overlay'),
            rogue: document.getElementById('rogue-overlay'),
            settle: document.getElementById('settle-overlay')
        };
        
        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 核心變數 ---
        let gameActive = false, isPaused = false;
        let selectedHero = 'leon', money = 150000, wave = 1;
        let waveTimer = 0, spawnTimer = 0, skillCooldown = 0, screenShakeTime = 0;
        
        let player = { x: 0, y: 0, color: '#fff' };
        let bullets = [], enemies = [], enemyBullets = [], particles = [], floatTexts = [], boss = null;
        
        // 增幅數值 (限制上限防止崩潰)
        let stats = { atkSpeed: 1.0, bulletSize: 1.0, drones: 0, revive: 0, income: 1.0 };
        
        // 視覺：背景網格滾動
        let gridOffset = 0;

        const talents = [
            { id: 'atk', t: '⚡ 當沖手速', d: '射速提升 25%' },
            { id: 'size', t: '🔥 融資爆破', d: '子彈體積增強 30%' },
            { id: 'drone', t: '🤖 算力升級', d: '增加 1 架浮游砲' },
            { id: 'life', t: '🛡️ 寬限期', d: '獲得 1 次免死復活' },
            { id: 'money', t: '💰 左手換右手', d: '擊殺收益提升 40%' }
        ];

        // --- 輸入控制 ---
        let tx = 0, ty = 0;
        canvas.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
        canvas.addEventListener('touchmove', e => {
            if(!gameActive || isPaused) return;
            e.preventDefault();
            player.x += (e.touches[0].clientX - tx) * 1.3;
            player.y += (e.touches[0].clientY - ty) * 1.3;
            player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
            player.y = Math.max(canvas.height*0.3, Math.min(canvas.height - 30, player.y));
            tx = e.touches[0].clientX; ty = e.touches[0].clientY;
        }, {passive:false});

        let lastTap = 0;
        canvas.addEventListener('touchend', () => {
            if(!gameActive || isPaused) return;
            let now = performance.now();
            if(now - lastTap < 300 && skillCooldown <= 0) triggerUltimate();
            lastTap = now;
        });

        document.querySelectorAll('.hero-card').forEach(c => {
            c.addEventListener('click', (e) => {
                selectedHero = e.currentTarget.dataset.hero;
                player.color = selectedHero === 'leon' ? '#39ff14' : selectedHero === 'chloe' ? '#ff007f' : '#00ffff';
                startGame();
            });
        });

        document.getElementById('btn-restart').addEventListener('click', startGame);

        function startGame() {
            Object.values(overlays).forEach(o => o.classList.add('hidden'));
            gameActive = true; isPaused = false;
            money = 150000; wave = 1; waveTimer = 0; spawnTimer = 0; skillCooldown = 0; screenShakeTime = 0;
            stats = { atkSpeed: 1.0, bulletSize: 1.0, drones: selectedHero==='sigma'?2:0, revive: 0, income: 1.0 };
            bullets = []; enemies = []; enemyBullets = []; particles = []; floatTexts = []; boss = null;
            player.x = canvas.width / 2; player.y = canvas.height * 0.8;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function triggerUltimate() {
            skillCooldown = 15;
            screenShakeTime = 0.5; // 強烈震動
            createExplosion(player.x, player.y, '#fff', 50);
            floatTexts.push({ x: player.x, y: player.y - 40, txt: "時空斷裂!", col: '#fff', life: 1.5 });
            
            enemies.forEach(e => { money += 15000 * wave; createExplosion(e.x, e.y, '#ff007f', 15); });
            enemyBullets.forEach(b => createExplosion(b.x, b.y, '#ff3333', 5));
            enemies = []; enemyBullets = [];
            if(boss) boss.hp -= boss.maxHp * 0.3; // 扣除 Boss 30% 血量
        }

        function showRogueUI() {
            isPaused = true;
            const box = document.getElementById('rogue-cards-box');
            box.innerHTML = '';
            let shuffled = [...talents].sort(() => 0.5 - Math.random()).slice(0, 3);
            shuffled.forEach(t => {
                let div = document.createElement('div');
                div.className = 'rogue-card';
                div.innerHTML = `<div class="rogue-card-title">${t.t}</div><div style="font-size:12px;color:#a0a5c0;">${t.d}</div>`;
                div.onclick = () => applyTalent(t.id);
                box.appendChild(div);
            });
            overlays.rogue.classList.remove('hidden');
        }

        function applyTalent(id) {
            if(id==='atk') stats.atkSpeed += 0.25;
            if(id==='size') stats.bulletSize += 0.3;
            if(id==='drone') stats.drones++;
            if(id==='life') stats.revive++;
            if(id==='money') stats.income += 0.4;
            overlays.rogue.classList.add('hidden');
            isPaused = false;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function createExplosion(x, y, color, count=10) {
            for(let i=0; i<count; i++) {
                let ang = Math.random() * Math.PI * 2, spd = Math.random() * 5 + 2;
                particles.push({ x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd, r: Math.random()*3+1, col: color, life: 1.0 });
            }
        }

        let lastTime = 0, shotTimer = 0;
        function gameLoop(timestamp) {
            if(!gameActive) return;
            if(isPaused) return;
            
            let dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            // 繪製背景與網格
            ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 畫面震動系統
            ctx.save();
            if(screenShakeTime > 0) {
                screenShakeTime -= dt;
                let dx = (Math.random() - 0.5) * 15;
                let dy = (Math.random() - 0.5) * 15;
                ctx.translate(dx, dy);
            }

            gridOffset = (gridOffset + 50 * dt) % 40;
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)'; ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i=0; i<canvas.width; i+=40) { ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); }
            for(let j=0; j<canvas.height; j+=40) { ctx.moveTo(0, j + gridOffset); ctx.lineTo(canvas.width, j + gridOffset); }
            ctx.stroke();

            if(skillCooldown > 0) skillCooldown -= dt;

            // 波段推進
            waveTimer += dt;
            if(waveTimer > 15 && !boss) {
                wave++; waveTimer = 0;
                if(wave % 3 === 0) {
                    boss = { x: canvas.width/2, y: -80, hp: 1000 * wave, maxHp: 1000 * wave, phaseTimer: 0, attackPhase: 0, moveAng: 0 };
                    floatTexts.push({ x: canvas.width/2, y: canvas.height/2, txt: "⚠️ 外資主力進場 ⚠️", col: '#ff3333', life: 2.5 });
                    screenShakeTime = 0.5;
                } else {
                    showRogueUI(); return;
                }
            }

            // 玩家射擊 (限制最大子彈尺寸，防止遮蔽螢幕)
            shotTimer += dt;
            let fireRate = (selectedHero === 'chloe' ? 0.1 : 0.2) / stats.atkSpeed;
            if(shotTimer >= fireRate) {
                shotTimer = 0;
                // 強制封頂機制：基礎尺寸最大擴增 2.5 倍
                let bSize = Math.min((selectedHero === 'leon' ? 6 : 4) * stats.bulletSize, 15); 
                
                if(selectedHero === 'leon') bullets.push({x: player.x, y: player.y-15, vx: 0, vy: -12, s: bSize, c: player.color, dmg: 1.5});
                else if(selectedHero === 'chloe') {
                    bullets.push({x: player.x-10, y: player.y-10, vx: -3, vy: -10, s: bSize, c: player.color, dmg: 0.8});
                    bullets.push({x: player.x+10, y: player.y-10, vx: 3, vy: -10, s: bSize, c: player.color, dmg: 0.8});
                } else {
                    bullets.push({x: player.x, y: player.y-15, vx: 0, vy: -11, s: bSize, c: player.color, dmg: 1.0});
                }
            }

            // 浮游砲射擊
            if(stats.drones > 0 && Math.random() < 0.15) {
                for(let d=0; d<stats.drones; d++) {
                    let off = d % 2 === 0 ? -30 - d*5 : 30 + (d-1)*5;
                    bullets.push({x: player.x+off, y: player.y, vx: 0, vy: -12, s: 3, c: '#00ffff', dmg: 0.5});
                }
            }

            // --- 敵方 AI ---
            // Boss 邏輯
            if(boss) {
                boss.phaseTimer += dt;
                boss.moveAng += dt;
                // S型平滑移動
                boss.y = Math.min(80, boss.y + 60 * dt);
                boss.x = canvas.width/2 + Math.sin(boss.moveAng) * 100;
                
                // 彈幕攻擊
                if(boss.phaseTimer > 1.2 - (wave*0.05)) {
                    boss.phaseTimer = 0;
                    boss.attackPhase = (boss.attackPhase + 1) % 2;
                    if(boss.attackPhase === 0) {
                        // 鎖定玩家狙擊
                        let dx = player.x - boss.x, dy = player.y - boss.y;
                        let dist = Math.hypot(dx, dy);
                        enemyBullets.push({x: boss.x, y: boss.y, vx: (dx/dist)*5, vy: (dy/dist)*5, r: 6, c: '#ff3333'});
                    } else {
                        // 環狀彈幕
                        for(let i=0; i<5; i++) {
                            let a = (Math.PI/4) + (i * Math.PI/8);
                            enemyBullets.push({x: boss.x, y: boss.y, vx: Math.cos(a)*4, vy: Math.sin(a)*4, r: 5, c: '#ff007f'});
                        }
                    }
                }

                // 畫Boss
                ctx.fillStyle = '#111'; ctx.strokeStyle = '#ff3333'; ctx.lineWidth=3;
                ctx.fillRect(boss.x-40, boss.y-20, 80, 40); ctx.strokeRect(boss.x-40, boss.y-20, 80, 40);
                ctx.fillStyle='#ff3333'; ctx.fillRect(boss.x-40, boss.y-30, 80*(boss.hp/boss.maxHp), 4);
                ctx.fillStyle='#fff'; ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.fillText('三大法人', boss.x, boss.y+4);
            }

            // 一般散戶生成 (加入 AI 行為)
            spawnTimer += dt;
            if(spawnTimer > Math.max(0.3, 1.2 - wave*0.1) && !boss) {
                spawnTimer = 0;
                let type = Math.random(); 
                // 0: 直線韭菜, 1: S型隔日沖, 2: 追蹤狙擊手
                enemies.push({
                    x: Math.random()*(canvas.width-40)+20, y: -20, startX: 0,
                    vy: Math.random()*2 + 2 + wave*0.2,
                    r: Math.random()*8 + 12,
                    type: type < 0.6 ? 0 : (type < 0.85 ? 1 : 2),
                    ang: 0
                });
                enemies[enemies.length-1].startX = enemies[enemies.length-1].x;
            }

            // 物理與碰撞
            for(let i=enemyBullets.length-1; i>=0; i--) {
                let eb = enemyBullets[i]; eb.x += eb.vx; eb.y += eb.vy;
                ctx.fillStyle = eb.c; ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI*2); ctx.fill();
                // 擊中玩家
                if(Math.hypot(player.x - eb.x, player.y - eb.y) < eb.r + 10) {
                    takeDamage(30000);
                    enemyBullets.splice(i, 1);
                } else if(eb.y > canvas.height) enemyBullets.splice(i, 1);
            }

            for(let i=enemies.length-1; i>=0; i--) {
                let e = enemies[i];
                e.y += e.vy;
                if(e.type === 1) { // S 型
                    e.ang += dt * 3; e.x = e.startX + Math.sin(e.ang) * 40;
                } else if (e.type === 2 && e.y > canvas.height*0.2 && e.y < canvas.height*0.4) {
                    // 停留並加速衝向玩家
                    e.vy = 0;
                    if(!e.aimed) { e.aimed = true; let dx = player.x-e.x, dy = player.y-e.y; let dist=Math.hypot(dx,dy); e.vx=(dx/dist)*6; e.vy=(dy/dist)*6; }
                    e.x += e.vx || 0;
                }

                ctx.strokeStyle = '#ff334b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.stroke();
                ctx.fillStyle = '#ff334b'; ctx.font = '10px sans-serif'; ctx.fillText(e.type===1?'隔日沖':'韭菜', e.x, e.y+3);

                // 漏接懲罰
                if(e.y > canvas.height+20) { takeDamage(20000); enemies.splice(i,1); continue; }
                // 撞擊玩家
                if(Math.hypot(player.x - e.x, player.y - e.y) < e.r + 12) {
                    takeDamage(40000); enemies.splice(i,1); continue;
                }

                // 被玩家子彈打中
                for(let j=bullets.length-1; j>=0; j--) {
                    let b = bullets[j];
                    if(Math.hypot(b.x - e.x, b.y - e.y) < e.r + b.s) {
                        bullets.splice(j, 1);
                        createExplosion(e.x, e.y, player.color, 5);
                        let gain = 5000 * wave * stats.income;
                        if(selectedHero === 'leon' && Math.random() < 0.25) { gain *= 3; floatTexts.push({x: e.x, y: e.y, txt: "暴擊!", col: '#39ff14', life: 0.8}); }
                        money += gain;
                        enemies.splice(i, 1);
                        break;
                    }
                }
            }

            for(let i=bullets.length-1; i>=0; i--) {
                let b = bullets[i]; b.x += b.vx; b.y += b.vy;
                ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(b.x, b.y, b.s, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 10; ctx.shadowColor = b.c; // 增加光暈
                
                // 打王
                if(boss && Math.abs(b.x - boss.x) < 40 + b.s && Math.abs(b.y - boss.y) < 20 + b.s) {
                    boss.hp -= 20 * b.dmg * wave;
                    bullets.splice(i, 1);
                    createExplosion(b.x, b.y, '#ffcd00', 3);
                    if(boss.hp <= 0) {
                        money += 800000 * stats.income;
                        screenShakeTime = 1.0; // 打敗王強烈震動
                        createExplosion(boss.x, boss.y, '#ffcd00', 80);
                        floatTexts.push({x: boss.x, y: boss.y, txt: "主力陣亡! +$800,000", col: '#ffcd00', life: 2});
                        boss = null;
                        setTimeout(showRogueUI, 1500); // 打完王給予升級
                    }
                } else if(b.y < -20 || b.x < -20 || b.x > canvas.width+20) bullets.splice(i, 1);
                ctx.shadowBlur = 0;
            }

            // 畫玩家
            ctx.fillStyle = player.color; ctx.shadowBlur = 15; ctx.shadowColor = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - 15); ctx.lineTo(player.x + 12, player.y + 10); ctx.lineTo(player.x - 12, player.y + 10);
            ctx.fill(); ctx.shadowBlur = 0;
            
            if(stats.drones > 0) {
                ctx.fillStyle = '#00ffff';
                for(let d=0; d<stats.drones; d++) {
                    let off = d % 2 === 0 ? -32 - d*5 : 32 + (d-1)*5;
                    ctx.fillRect(player.x + off - 3, player.y + 5, 6, 8);
                }
            }

            // 畫粒子與浮動文字
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life -= dt * 1.5;
                ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.col;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
                if(p.life <= 0) particles.splice(i, 1);
            });
            ctx.globalAlpha = 1.0;

            floatTexts.forEach((t, i) => {
                t.y -= 25 * dt; t.life -= dt;
                ctx.globalAlpha = Math.max(0, t.life); ctx.fillStyle = t.col;
                ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(t.txt, t.x, t.y);
                if(t.life <= 0) floatTexts.splice(i, 1);
            });
            ctx.globalAlpha = 1.0;

            ctx.restore(); // 結束震動畫布層

            // HUD 更新
            let ratio = Math.max(0, Math.floor((money / 150000) * 120));
            document.getElementById('hud-wave').innerText = wave.toString().padStart(2, '0');
            document.getElementById('hud-money').innerText = `$${Math.floor(money).toLocaleString()}`;
            const ratioEl = document.getElementById('hud-ratio');
            ratioEl.innerText = `${ratio}%`;
            ratioEl.style.color = ratio < 100 ? '#ff3333' : '#ff007f';

            requestAnimationFrame(gameLoop);
        }

        function takeDamage(amt) {
            money -= amt;
            screenShakeTime = 0.2;
            createExplosion(player.x, player.y, '#ff3333', 15);
            if(money <= 0) {
                if(stats.revive > 0) {
                    stats.revive--; money = 100000;
                    floatTexts.push({x: player.x, y: player.y-30, txt: "寬限期觸發!", col: '#00ffff', life: 2});
                } else {
                    gameActive = false;
                    document.getElementById('settle-score').innerText = `$${document.getElementById('hud-money').innerText.replace('$','')}`;
                    overlays.settle.classList.remove('hidden');
                }
            }
        }
    </script>
</body>
</html>
