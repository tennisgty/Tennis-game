<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>少年股神：全倉進場 2026</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; padding: 0; background-color: #0d0e15; color: #fff;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh;
        }
        #game-container {
            position: relative; width: 100%; max-width: 420px; height: 100vh;
            background: #0d0e15; display: flex; flex-direction: column; overflow: hidden;
        }
        canvas { background: #131520; display: block; width: 100%; height: 100%; }
        
        /* 介面遮罩 */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 14, 21, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; padding: 20px;
            text-align: center;
        }
        .hidden { display: none !important; }
        
        .title { font-size: 28px; font-weight: 900; color: #39ff14; text-shadow: 0 0 10px #39ff14; margin-bottom: 5px; }
        .subtitle { font-size: 14px; color: #888; margin-bottom: 25px; }
        
        /* 角色選擇卡片 */
        .hero-select-container { width: 100%; display: flex; flex-direction: column; gap: 15px; }
        .hero-card {
            background: #1a1d2e; border: 2px solid #2f3456; border-radius: 12px;
            padding: 15px; display: flex; align-items: center; cursor: pointer;
            transition: all 0.2s ease; position: relative;
        }
        .hero-card:active { transform: scale(0.98); background: #22273f; }
        .hero-avatar { font-size: 32px; margin-right: 15px; }
        .hero-info { text-align: left; flex: 1; }
        .hero-name { font-size: 18px; font-weight: bold; color: #fff; }
        .hero-desc { font-size: 12px; color: #aaa; margin-top: 3px; }
        .hero-ability { font-size: 11px; color: #00ffff; margin-top: 5px; font-weight: bold; }
        
        /* 顏色樣式 */
        .card-all-in { border-color: #ff4757; }
        .card-all-in .hero-name { color: #ff4757; }
        .card-day { border-color: #ffa502; }
        .card-day .hero-name { color: #ffa502; }
        .card-value { border-color: #2ed573; border-color: #00ffff; }
        .card-value .hero-name { color: #00ffff; }

        /* 結算畫面設計 */
        .settle-score { font-size: 32px; font-weight: 900; color: #ff4757; margin: 15px 0; }
        .input-name {
            width: 80%; padding: 12px; background: #1a1d2e; border: 2px solid #39ff14;
            color: #fff; font-size: 16px; border-radius: 8px; text-align: center; margin-bottom: 15px;
            outline: none;
        }
        .btn {
            width: 80%; padding: 14px; font-size: 16px; font-weight: bold; border: none;
            border-radius: 25px; cursor: pointer; margin-top: 10px; color: #000;
            background: linear-gradient(90deg, #39ff14, #00ffff); box-shadow: 0 0 10px rgba(57,255,20,0.5);
        }
        .btn-back {
            background: #222; color: #aaa; box-shadow: none; border: 1px solid #444; margin-top: 15px;
        }
        
        /* 排行榜 */
        .rank-list { width: 90%; background: #141622; border: 1px solid #222; border-radius: 8px; padding: 10px; margin-top: 15px; text-align: left; }
        .rank-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #222; font-size: 13px; }
        .rank-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="menu-overlay" class="overlay">
            <div class="title">少年股神</div>
            <div class="subtitle">全倉進場 · 賽博斷頭割草大戰 2026</div>
            
            <div class="hero-select-container">
                <div class="hero-card card-all-in" data-hero="allin">
                    <div class="hero-avatar">🔥</div>
                    <div class="hero-info">
                        <div class="hero-name">新莊少年股神（歐印流）</div>
                        <div class="hero-desc">開局自帶融資開滿氣勢。一張不賣，奇蹟自來！</div>
                        <div class="hero-ability">✨ 特殊技：不當賠·違約交割時空術（冷卻: 12秒）</div>
                    </div>
                </div>
                
                <div class="hero-card card-day" data-hero="daytrade">
                    <div class="hero-avatar">⚡</div>
                    <div class="hero-info">
                        <div class="hero-name">竹科工程師（當沖女王）</div>
                        <div class="hero-desc">絕不留倉過夜！極致的手速與爆發力。</div>
                        <div class="hero-ability">✨ 特殊技：萬能週轉金彈幕（冷卻: 8秒）</div>
                    </div>
                </div>

                <div class="hero-card card-value" data-hero="value">
                    <div class="hero-avatar">💎</div>
                    <div class="hero-info">
                        <div class="hero-name">公園冷靜大叔（價值投資）</div>
                        <div class="hero-desc">手握大把高股息，防禦力驚人，越跌我越買。</div>
                        <div class="hero-ability">✨ 特殊技：無痛填息護體盾（冷卻: 15秒）</div>
                    </div>
                </div>
            </div>
            
            <a href="index.html" class="btn btn-back" style="text-decoration:none; width:85%; max-width:350px;">🎾 返回重砲發球訓練場</a>
        </div>

        <div id="settle-overlay" class="overlay hidden">
            <div id="settle-title" class="title" style="color:#ff4757; text-shadow:0 0 10px #ff4757;">融資斷頭悲情清算</div>
            <div class="subtitle">少年股神，你的身價已淪為壁紙...</div>
            <div id="settle-score" class="settle-score">$0</div>
            
            <input type="text" id="player-name" class="input-name" placeholder="請留名以資警惕（如: 11沒袋子）" maxLength="10">
            <button id="btn-save" class="btn">💥 紀錄並寫入歷史富豪榜</button>
            
            <div class="rank-list">
                <div style="font-weight:bold; color:#00ffff; margin-bottom:5px; font-size:14px; text-align:center;">🏆 歷史富豪（韭菜）榜</div>
                <div id="rank-items-box"></div>
            </div>
            
            <button id="btn-restart" class="btn btn-back">🔄 再全倉進場一次</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menuOverlay = document.getElementById('menu-overlay');
        const settleOverlay = document.getElementById('settle-overlay');
        const playerNameInput = document.getElementById('player-name');
        
        // 調整畫布尺寸
        function resizeCanvas() {
            const container = document.getElementById('game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 遊戲狀態與變數
        let gameActive = false;
        let selectedHero = 'allin';
        let money = 100000; // 開局身價
        let maxMoney = 100000;
        let wave = 1;
        let skillCooldown = 0;
        
        let player = { x: 0, y: 0, size: 20, speed: 5 };
        let bullets = [];
        let enemies = [];
        let particles = [];
        let enemySpawnTimer = 0;
        let keys = {};
        
        // 彈幕文字池
        const texts = ["慘戶是我", "一張不賣", "悲情融資", "救救我", "全倉進場", "違約交割", "睡公園", "攤平再攤平", "韭菜之光", "綠光罩頂"];

        // 🚀 核心修復：統一觸控與點擊邏輯，防止選單卡死
        function handleHeroSelection(e) {
            e.preventDefault();
            e.stopPropagation();
            
            const card = e.currentTarget;
            selectedHero = card.getAttribute('data-hero');
            
            // 完美初始化並開始遊戲
            initGame();
        }

        const cards = document.querySelectorAll('.hero-card');
        cards.forEach(card => {
            card.addEventListener('touchstart', handleHeroSelection, { passive: false });
            card.addEventListener('click', handleHeroSelection);
        });

        // 初始化遊戲數據
        function initGame() {
            money = selectedHero === 'allin' ? 200000 : (selectedHero === 'value' ? 80000 : 120000);
            maxMoney = money;
            wave = 1;
            skillCooldown = 0;
            bullets = [];
            enemies = [];
            particles = [];
            enemySpawnTimer = 0;
            
            player.x = canvas.width / 2;
            player.y = canvas.height * 0.8;
            
            // 隱藏選單，啟動遊戲引擎
            menuOverlay.classList.add('hidden');
            settleOverlay.classList.add('hidden');
            gameActive = true;
            
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        // 觸控與滑動控制主角移動
        let touchStartX = 0;
        let touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            if(!gameActive) return;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if(!gameActive) return;
            e.preventDefault();
            const touchX = e.touches[0].clientX;
            const touchY = e.touches[0].clientY;
            
            const dx = touchX - touchStartX;
            const dy = touchY - touchStartY;
            
            player.x += dx * 0.8;
            player.y += dy * 0.8;
            
            // 限制邊界
            if (player.x < player.size) player.x = player.size;
            if (player.x > canvas.width - player.size) player.x = canvas.width - player.size;
            if (player.y < canvas.height * 0.4) player.y = canvas.height * 0.4;
            if (player.y > canvas.height - player.size) player.y = canvas.height - player.size;
            
            touchStartX = touchX;
            touchStartY = touchY;
        }, { passive: false });

        // 雙擊釋放技能
        let lastTap = 0;
        canvas.addEventListener('touchend', (e) => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 300 && tapLength > 0) {
                triggerSkill();
            }
            lastTap = currentTime;
        });

        function triggerSkill() {
            if (skillCooldown > 0) return;
            skillCooldown = selectedHero === 'daytrade' ? 8 : (selectedHero === 'allin' ? 12 : 15);
            
            // 釋放全螢幕彈幕清場
            for(let i=0; i<36; i++) {
                let angle = (i * 10) * Math.PI / 180;
                bullets.push({
                    x: player.x, y: player.y,
                    vx: Math.cos(angle) * 7, vy: Math.sin(angle) * 7,
                    size: 6, color: '#00ffff', text: '⚡週轉金護體⚡'
                });
            }
        }

        // 遊戲主迴圈
        let lastTime = 0;
        function gameLoop(timestamp) {
            if (!gameActive) return;
            
            let dt = (timestamp - lastTime) / 1000;
            if(dt > 0.1) dt = 0.1; // 防止背景喚醒大暴衝
            lastTime = timestamp;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 技能冷卻倒數
            if (skillCooldown > 0) {
                skillCooldown -= dt;
                if (skillCooldown < 0) skillCooldown = 0;
            }
            
            // 自動射擊
            enemySpawnTimer += dt;
            if (bullets.length < 50 && Math.random() < 0.15) {
                bullets.push({
                    x: player.x, y: player.y - player.size,
                    vx: 0, vy: -8, size: 4, color: '#39ff14'
                });
            }
            
            // 生產慘戶敵軍
            let spawnRate = Math.max(0.3, 1.5 - wave * 0.1);
            if (enemySpawnTimer > spawnRate) {
                enemySpawnTimer = 0;
                enemies.push({
                    x: Math.random() * (canvas.width - 40) + 20, y: -20,
                    vy: Math.random() * 2 + 1 + wave * 0.2,
                    size: 15,
                    text: texts[Math.floor(Math.random() * texts.length)]
                });
            }
            
            // 更新並繪製子彈
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx; b.y += b.vy;
                
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size, 0, Math.PI*2);
                ctx.fill();
                
                if (b.text) {
                    ctx.fillStyle = '#00ffff';
                    ctx.font = '10px sans-serif';
                    ctx.fillText(b.text, b.x - 20, b.y - 8);
                }
                
                if (b.y < -50 || b.y > canvas.height + 50 || b.x < -50 || b.x > canvas.width + 50) {
                    bullets.splice(i, 1);
                }
            }
            
            // 更新並繪製敵軍
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.vy;
                
                ctx.fillStyle = 'rgba(255, 71, 87, 0.2)';
                ctx.strokeStyle = '#ff4757';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.size, 0, Math.PI*2);
                ctx.fill();
                ctx.stroke();
                
                ctx.fillStyle = '#ff6b81';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(e.text, e.x, e.y + 4);
                
                // 子彈與敵軍碰撞檢測
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    let dist = Math.hypot(b.x - e.x, b.y - e.y);
                    if (dist < e.size + b.size) {
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        money += 5000 * wave;
                        if(money > maxMoney) maxMoney = money;
                        break;
                    }
                }
                
                // 敵軍穿越底線或撞擊玩家
                if (gameActive && e.y > canvas.height + 20) {
                    enemies.splice(i, 1);
                    money -= 35000; // 斷頭打擊
                    if (money <= 0) gameOver();
                } else if (gameActive && Math.hypot(player.x - e.x, player.y - e.y) < player.size + e.size) {
                    enemies.splice(i, 1);
                    money -= 50000;
                    if (money <= 0) gameOver();
                }
            }
            
            // 繪製玩家主角
            ctx.fillStyle = selectedHero === 'allin' ? '#ff4757' : (selectedHero === 'daytrade' ? '#ffa502' : '#00ffff');
            ctx.shadowBlur = 15;
            ctx.shadowColor = ctx.fillStyle;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0; // 重設發光
            
            // 繪製頂部狀態列
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`當前身價: $${money.toLocaleString()}`, 15, 30);
            
            ctx.textAlign = 'right';
            ctx.font = '13px sans-serif';
            ctx.fillText(`雙擊釋放特技 (CD: ${Math.ceil(skillCooldown)}s)`, canvas.width - 15, 30);
            
            // 波段自動升級
            if (Math.random() < 0.001) wave++;

            requestAnimationFrame(gameLoop);
        }

        // 遊戲結束結算
        function gameOver() {
            gameActive = false;
            money = 0;
            
            document.getElementById('settle-score').innerText = `$${maxMoney.toLocaleString()}`;
            settleOverlay.classList.remove('hidden');
            showRankings();
        }

        // 🏆 排行榜富豪榜資料引擎 (localStorage)
        function showRankings() {
            let ranks = JSON.parse(localStorage.getItem('cyber_stock_ranks')) || [
                { name: "少年股神始祖", score: 500000 },
                { name: "信義區割草機", score: 300000 },
                { name: "慘戶一號", score: 100000 }
            ];
            
            const box = document.getElementById('rank-items-box');
            box.innerHTML = '';
            
            ranks.sort((a,b) => b.score - a.score).slice(0, 5).forEach((item, index) => {
                box.innerHTML += `
                    <div class="rank-item">
                        <span style="color:${index===0?'#39ff14':'#fff'}">第 ${index+1} 名: ${item.name}</span>
                        <span style="color:#ff4757; font-weight:bold;">$${item.score.toLocaleString()}</span>
                    </div>
                `;
            });
        }

        // 儲存名字點擊事件
        function saveRankHandler(e) {
            e.preventDefault();
            let name = playerNameInput.value.trim() || "無名韭菜";
            let ranks = JSON.parse(localStorage.getItem('cyber_stock_ranks')) || [];
            
            ranks.push({ name: name, score: maxMoney });
            ranks.sort((a,b) => b.score - a.score);
            localStorage.setItem('cyber_stock_ranks', JSON.stringify(ranks));
            
            showRankings();
            alert("歷史紀錄寫入成功！富豪榜已更新。");
            document.getElementById('btn-save').disabled = true;
        }

        document.getElementById('btn-save').addEventListener('click', saveRankHandler);

        // 重新開始
        function restartHandler(e) {
            e.preventDefault();
            document.getElementById('btn-save').disabled = false;
            playerNameInput.value = '';
            settleOverlay.classList.add('hidden');
            menuOverlay.classList.remove('hidden');
        }
        document.getElementById('btn-restart').addEventListener('click', restartHandler);
    </script>
</body>
</html>
